# Publishes the node pack to the ComfyUI Registry when the version in
# pyproject.toml changes on main. Requires the REGISTRY_ACCESS_TOKEN repo
# secret (a Registry publisher API key) — without it the run fails harmlessly.
name: Publish to ComfyUI Registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to Registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'SonderSaid' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
