  <g transform="translate(32 32) scale(0.84)">
    <rect fill="#6686a3" x="186" y="26" width="28" height="348" rx="14"/>
    <path id="sonder-s-curve" fill="#e7ecf2" d="M 318 40 H 155 C 96 40, 60 76, 60 128 C 60 150, 68 164, 82 172 H 140 C 121 162, 112 146, 112 128 C 112 106, 128 96, 155 96 H 318 Q 340 96, 340 74 V 62 Q 340 40, 318 40 Z"/>
    <use href="#sonder-s-curve" transform="rotate(180 200 200)"/>
    <rect fill="#6686a3" x="62" y="164" width="276" height="72" rx="14"/>
  </g>
</svg>
