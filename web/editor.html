<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sonder Editor</title>
    <style>
        html,
        body {
            margin: 0;
            min-width: 0;
            min-height: 100%;
            background: #0f141a;
            color: #dbe3ea;
            font-family: "Segoe UI", Arial, sans-serif;
            overflow: hidden;
        }

        #status {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            color: #9ca9b5;
            background: #0f141a;
            font-size: 13px;
            z-index: 1;
        }

        body.ready #status {
            display: none;
        }
    </style>
</head>
<body>
    <div id="status">Loading editor...</div>
    <script type="module" src="/sonder-editor/static/js/tab_entry.js"></script>
</body>
</html>
